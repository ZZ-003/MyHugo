# hugo.toml

# --- 核心修复 ---
# 1. 必须设为 false，否则 CSS 路径会乱
relativeURLs = false
# 2. 保持 false
uglyURLs = false
# 3. 站点正式域名（绝对地址），Vercel 也可通过 HUGO_BASEURL 覆盖
baseURL = "https://zde2cf.vercel.app/"

languageCode = "zh-cn"
# 按中日韩字符计数（否则中文正文会被当成 1 个单词）
hasCJKLanguage = true
# 语言 key 必须与主题 i18n 文件名一致（zh-Hans.yaml）
defaultContentLanguage = "zh-Hans"
title = "欢迎来到my博客"

# 这一行是灵魂，告诉Hugo去 themes 文件夹找 congo
theme = "congo"

# [module] 及其之后的内容保持不变...
[module]
  [module.hugoVersion]
    extended = true
    min = "0.110.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
