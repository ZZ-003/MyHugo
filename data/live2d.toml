# ==========================================================================
# Live2D 看板娘配置中心
# 由 layouts/_partials/live2d.html 读取 —— 加模型 / 改台词只编辑本文件，不改代码。
#
# ▸ 加新模型：
#     1) 把模型整个文件夹放到 static/live2d/models/<id>/
#     2) 在下面追加一个 [[models]] 块（id = 目录名）
#     3) 完成。菜单"切换模型"会自动包含新模型
#
# ▸ 改台词：直接编辑 [tips.*] 各节
# ▸ 行为开关：[behavior] 各项
# ▸ 更进一步的扩展（菜单项、事件联动）：见 live2d.html 顶部注释
# ==========================================================================

# ---------- 模型注册表 ----------
[[models]]
  id       = "cat-black"            # 小黑猫（hijiki），安静低调
  json     = "model.json"           # 模型入口文件（相对模型目录）
  scale    = 0.135                  # 缩放（实测校准：画布 300x400 内完整显示）
  position = [50, 80]               # 舞台内偏移 [x, y]（实测校准：居中贴底）

# 示例：以后想加模型，追加块即可（先把目录下载到 static/live2d/models/ 下）
# [[models]]
#   id       = "shizuku"          # 经典看板娘
#   json     = "shizuku.model.json"
#   scale    = 0.15
#   position = [50, 130]

# ---------- 台词库 ----------
[tips.welcome]
  weeHours  = "凌晨了，让文字陪你一会儿吧。"     # 0-4 点
  daybreak  = "天快亮了，一日之计在于晨。"       # 5-7 点
  morning   = "上午好，今天也要慢慢走。"         # 8-11 点
  noon      = "中午了，记得吃饭，别对付。"       # 12-13 点
  afternoon = "午后容易犯困，来杯茶吧。"         # 14-17 点
  dusk      = "傍晚了，黄昏正缠绕玫瑰与蛇。"     # 18-19 点（取自《拾语》）
  night     = "晚上好，今天过得怎么样？"         # 20-21 点
  lateNight = "这么晚了，早点休息吧，晚安。"     # 22-23 点

[tips.idle]
  messages = [
    "等石头在肋骨间开花。",
    "把坏习惯排成一排，检阅它们。",
    "每一个词都在赶往脆弱之地。",
    "风里有青草的味道。",
    "烦恼等一场雨过去，就轻了。",
    "写下来的东西，就替你记得了。",
  ]
  interval = 15000   # 闲聊气泡间隔（毫秒）
  duration = 5000    # 气泡停留时长（毫秒）

[tips.copy]
  messages = [
    "拾走的句子，记得注明来处哦。",
    "复制好了？记得回头看看上下文。",
  ]

[tips.tap]
  messages = [
    "呀！别戳啦",
    "嗯？怎么了？",
    "轻一点嘛…",
    "再戳要收费了哦",
    "好痒好痒！",
    "戳我是不会写出代码的",
    "喵？",
  ]

# ---------- 行为开关（后续功能的参数位） ----------
[behavior]
  mobileDisplay  = false    # 移动端隐藏；true 则手机上也显示（自动用移动端缩放）
  preloadAll     = true     # 预载全部动作，点击反应零延迟
  statusBar      = true     # 底部状态条（休息/换模型按钮）
  initialStatus  = "active" # 初次访问状态：active | sleep
  transitionTime = 1000     # 入场/离场过渡时长（毫秒）
